<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QuickWeds</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFF8F4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #2D3748;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      border-radius: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #1A202C;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #718096;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background: #E11D48;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192x192.png" alt="QuickWeds" class="logo" onerror="this.style.display='none'" />
    <h1>Connecting to QuickWeds...</h1>
    <p>Please check your internet connection and try again.</p>
    <button class="btn" onclick="window.location.href='https://quickweds.site'">Retry Connection</button>
  </div>
  <script>
    if (navigator.onLine) {
      window.location.replace('https://quickweds.site');
    }
  </script>
</body>
</html>
