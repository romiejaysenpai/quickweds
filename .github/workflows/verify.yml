name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberately non-production placeholders. Playwright also passes these
      # to its local dev server so the suite never needs production credentials.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: e2e-test-service-role-key
      STRIPE_SECRET_KEY: sk_test_quickweds_e2e_only
      RESEND_API_KEY: re_e2e_test_key
      RESEND_FROM_EMAIL: QuickWeds Tests <tests@example.invalid>
      CRON_SECRET: e2e-test-cron-secret-that-is-not-production
      E2E_TEST_MODE: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify
